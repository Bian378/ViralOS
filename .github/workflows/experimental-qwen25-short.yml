name: Qwen2.5 real English Short to evaluation video
on:
  pull_request:
    paths:
      - '.github/workflows/experimental-qwen25-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-qwen25-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-model-and-voice:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ollama in ephemeral runner
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          command -v ollama
      - name: Start loopback Ollama and pull Apache-2.0 Qwen2.5 1.5B
        run: |
          export OLLAMA_HOST="127.0.0.1:11434"
          if ! curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then
            OLLAMA_CONTEXT_LENGTH=2048 OLLAMA_NUM_PARALLEL=1 nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/version
          ollama pull qwen2.5:1.5b-instruct-q4_K_M
      - name: Test REAL bounded neural English manuscript generation
        id: manuscript
        run: |
          node --experimental-strip-types scripts/real_qwen25_short.mjs "$RUNNER_TEMP/real-short"
          if test -s "$RUNNER_TEMP/real-short/source-DRAFT.json"; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Only for valid manuscript, install English neural voice and FFmpeg
        if: steps.manuscript.outputs.passed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python3 -m venv "$RUNNER_TEMP/voice-venv"
          "$RUNNER_TEMP/voice-venv/bin/pip" install --disable-pip-version-check 'piper-tts>=1.3,<2'
          mkdir -p "$RUNNER_TEMP/voices"
          "$RUNNER_TEMP/voice-venv/bin/python" -m piper.download_voices --data-dir "$RUNNER_TEMP/voices" en_US-joe-medium
      - name: Generate evaluation-only MP4 from REAL AI script and REAL neural voice
        if: steps.manuscript.outputs.passed == 'true'
        run: |
          "$RUNNER_TEMP/voice-venv/bin/python" worker/build_short_draft.py \
            "$RUNNER_TEMP/real-short/source-DRAFT.json" "$RUNNER_TEMP/real-short/rendered" \
            --piper-model "$RUNNER_TEMP/voices/en_US-joe-medium.onnx" \
            --voice-license-checked
          "$RUNNER_TEMP/voice-venv/bin/python" worker/verify_draft.py \
            "$RUNNER_TEMP/real-short/rendered"
          test -s "$RUNNER_TEMP/real-short/rendered/short-DRAFT.mp4"
      - name: Save evaluation results (NO model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VIRALOS-QWEN25-REAL-AI-EVALUATION-NOT-FOR-PUBLICATION
          path: |
            ${{ runner.temp }}/real-short/real-language-model-QC.json
            ${{ runner.temp }}/real-short/source-DRAFT.json
            ${{ runner.temp }}/real-short/rendered/short-DRAFT.mp4
            ${{ runner.temp }}/real-short/rendered/narration-generated-DRAFT.wav
            ${{ runner.temp }}/real-short/rendered/captions-ESTIMATED-DRAFT.srt
            ${{ runner.temp }}/real-short/rendered/draft-receipt.json
          if-no-files-found: warn
          retention-days: 2
