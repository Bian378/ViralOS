name: Experimental real English neural voice (draft only)
on:
  pull_request:
    paths:
      - '.github/workflows/experimental-piper-voice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piper-real-voice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-private-review-draft:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline-video and Piper neural-voice tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python3 -m venv "$RUNNER_TEMP/piper-venv"
          "$RUNNER_TEMP/piper-venv/bin/pip" install --disable-pip-version-check 'piper-tts>=1.3,<2'
      - name: Download temporary noncommercial-evaluation English voice
        run: |
          mkdir -p "$RUNNER_TEMP/voices"
          "$RUNNER_TEMP/piper-venv/bin/python" -m piper.download_voices \
            --data-dir "$RUNNER_TEMP/voices" en_US-joe-medium
          test -s "$RUNNER_TEMP/voices/en_US-joe-medium.onnx"
          test -s "$RUNNER_TEMP/voices/en_US-joe-medium.onnx.json"
      - name: Generate original English Short manifest (synthetic topic)
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          node --experimental-strip-types scripts/create_draft_plan.mjs \
            --script tests/fixtures/short_script_en.txt \
            --title "Original fictional storytelling concept" \
            --source-url https://example.org/fictional-story \
            --out "$RUNNER_TEMP/demo/source-DRAFT.json"
      - name: Render actual Piper voice + H264 MP4 with review locks
        run: |
          "$RUNNER_TEMP/piper-venv/bin/python" worker/build_short_draft.py \
            "$RUNNER_TEMP/demo/source-DRAFT.json" "$RUNNER_TEMP/demo/voice-preview" \
            --piper-model "$RUNNER_TEMP/voices/en_US-joe-medium.onnx" \
            --voice-license-checked
          "$RUNNER_TEMP/piper-venv/bin/python" worker/verify_draft.py \
            "$RUNNER_TEMP/demo/voice-preview"
          test -s "$RUNNER_TEMP/demo/voice-preview/narration-generated-DRAFT.wav"
          test -s "$RUNNER_TEMP/demo/voice-preview/short-DRAFT.mp4"
          python3 -c 'import json,os; p=os.environ["RUNNER_TEMP"]+"/demo/voice-preview/draft-receipt.json"; d=json.load(open(p)); assert d["audio"]=="local_piper" and d["audioIncluded"] is True and d["publicReleaseAuthorized"] is False and d["published"] is False;print("REAL_PIPER_NEURAL_VOICE_DRAFT_VERIFIED")'
      - name: Upload audio and video for human listening (NO MODEL FILE)
        uses: actions/upload-artifact@v4
        with:
          name: viralos-real-english-voice-PREVIEW-only
          path: |
            ${{ runner.temp }}/demo/voice-preview/narration-generated-DRAFT.wav
            ${{ runner.temp }}/demo/voice-preview/short-DRAFT.mp4
            ${{ runner.temp }}/demo/voice-preview/draft-receipt.json
            ${{ runner.temp }}/demo/voice-preview/short-DRAFT.qc.json
            ${{ runner.temp }}/demo/voice-preview/captions-ESTIMATED-DRAFT.srt
          if-no-files-found: error
          retention-days: 2
