name: Experimental real local Ollama draft (no AppDeploy)
on:
  pull_request:
    paths:
      - '.github/workflows/experimental-real-ollama.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-ollama-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-qwen-feasibility:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install Ollama on temporary runner
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          command -v ollama
      - name: Launch local Ollama and download small Apache 2.0 model
        run: |
          export OLLAMA_HOST="127.0.0.1:11434"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/version
          ollama pull qwen3:0.6b
      - name: Create genuine neural manuscript and validation report
        run: |
          node --experimental-strip-types scripts/experiment_real_ollama.mjs "$RUNNER_TEMP/real-model-test"
          test -s "$RUNNER_TEMP/real-model-test/actual-ollama-output-UNVERIFIED.json"
      - name: Save only draft response and optional storyboard (no model)
        uses: actions/upload-artifact@v4
        with:
          name: viralos-Qwen3-local-UNVERIFIED-manuscript
          path: |
            ${{ runner.temp }}/real-model-test/actual-ollama-output-UNVERIFIED.json
            ${{ runner.temp }}/real-model-test/source-DRAFT.json
          retention-days: 2
