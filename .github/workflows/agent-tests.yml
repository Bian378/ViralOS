name: ViralOS offline safety tests
on:
  pull_request:
    paths:
      - 'src/agent-workflow.ts'
      - 'src/momentum.ts'
      - 'src/manager.ts'
      - 'tests/*.test.mjs'
      - 'package.json'
      - '.github/workflows/agent-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test agent safety contracts and measured YouTube velocity
        run: node --experimental-strip-types --test tests/agent-workflow.test.mjs tests/manager-momentum.test.mjs
