name: ViralOS offline safety tests
on:
  pull_request:
    paths:
      - 'src/agent-workflow.ts'
      - 'src/momentum.ts'
      - 'src/manager.ts'
      - 'src/shorts-production-plan.ts'
      - 'src/subtitle-export.ts'
      - 'src/ShortsPlanPreview.tsx'
      - 'src/App.tsx'
      - 'worker/**'
      - 'tests/*.test.mjs'
      - 'package.json'
      - '.github/workflows/agent-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test agent safety contracts and measured YouTube velocity
        run: node --experimental-strip-types --test tests/agent-workflow.test.mjs tests/manager-momentum.test.mjs tests/shorts-production-plan.test.mjs tests/subtitle-export.test.mjs
      - name: Install free FFmpeg and DejaVu Sans for real preview smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Python renderer contract tests (offline)
        run: python3 -m unittest discover -s worker/tests -p 'test_*.py' -v
      - name: Assert FFmpeg smoke test actually ran
        run: |
          command -v ffmpeg
          command -v ffprobe
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
